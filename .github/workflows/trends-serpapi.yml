name: Trends lengkap lewat SerpApi

# Mengambil Rising/Top Google Trends lewat SerpApi (tanpa Chrome, tanpa login) ke data/trends_web.json.
# Kuota gratis SerpApi 250 pencarian/bulan: tiap jalan dibatasi 60 pencarian (satu rentang, 7 hari), seminggu sekali,
# jadi paling banyak sekitar 240 per bulan. Kata yang datanya masih baru dilewati, sehingga 96 topik terisi bertahap.
# Wajib: secret repo SERPAPI_KEY (Settings > Secrets and variables > Actions).
on:
  # JADWAL OTOMATIS SEDANG DIMATIKAN (hanya jalan lewat tombol Run workflow). Untuk mengaktifkan, hapus tanda # di dua baris ini:
  # schedule:
  #   - cron: "0 23 * * 0"   # Minggu 23:00 UTC = Senin 06:00 WIB
  workflow_dispatch:
    inputs:
      limit:
        description: "Batas pencarian SerpApi untuk jalan ini"
        default: "60"

permissions:
  contents: write

concurrency:
  group: repo-data
  cancel-in-progress: false

jobs:
  serpapi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ambil data lewat SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m app.cli trends-serpapi --window "now 7-d" --limit "${{ github.event.inputs.limit || '60' }}"
      - name: Simpan hasil ke repo
        run: |
          if [ -n "$(git status --porcelain data/trends_web.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trends_web.json
            git commit -m "Trends lengkap (SerpApi) $(date -u +%F)"
            git pull --rebase -q origin main
            git push
          else
            echo "Tidak ada perubahan data."
          fi
