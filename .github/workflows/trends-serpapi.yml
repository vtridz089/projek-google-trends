name: Trends lengkap lewat SerpApi

# Mengambil Rising/Top Google Trends lewat SerpApi (tanpa Chrome, tanpa login) ke data/trends_web.json.
# Bawaan: tiap hari kerja (Senin-Jumat ~05:00 WIB) meriset SEMUA keyword inti untuk kurun 24 jam (satu pencarian per keyword,
# sekitar 96 per hari, ~2.100 per bulan). Kuota gratis SerpApi 250/bulan per akun, jadi isi secret SERPAPI_KEY dengan
# beberapa API key dipisah koma (minimal 9-10 akun); key yang kuotanya habis dilewati otomatis.
# Selesai jauh sebelum server menarik data (08:30 WIB). Wajib: secret repo SERPAPI_KEY (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "0 22 * * 0-4"   # Minggu-Kamis 22:00 UTC = Senin-Jumat 05:00 WIB (Sabtu dan Minggu libur)
  workflow_dispatch:
    inputs:
      limit:
        description: "Batas pencarian SerpApi untuk jalan ini"
        default: "130"
      window:
        description: "Kurun waktu data Trends (satu kurun = satu pencarian per keyword)"
        type: choice
        default: "now 1-d"
        options:
          - "now 1-d"
          - "now 7-d"
          - "today 3-m"

permissions:
  contents: write

concurrency:
  group: repo-data
  cancel-in-progress: false

jobs:
  serpapi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ambil data lewat SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m app.cli trends-serpapi --window "${{ github.event.inputs.window || 'now 1-d' }}" --umur-jam 12 --limit "${{ github.event.inputs.limit || '130' }}"
      - name: Simpan hasil ke repo
        run: |
          if [ -n "$(git status --porcelain data/trends_web.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trends_web.json
            git commit -m "Trends lengkap (SerpApi) $(date -u +%F)"
            git pull --rebase -q origin main
            git push
          else
            echo "Tidak ada perubahan data."
          fi
